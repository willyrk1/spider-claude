# Cargo workspace: a pure-computation core library plus front ends that consume
# it. Today the only front end is the CLI; an HTTP API (and/or a WASM build) can
# be added as sibling crates without touching the core.
[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/api"]

# `cargo build` (no -p) builds only the zero-dependency core + CLI; the API,
# which pulls in axum/tokio, is built explicitly with `-p spider-api`.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Release profile tuned for search throughput (applies to every member).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
